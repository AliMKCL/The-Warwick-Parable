<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0e0e" />
    <link rel="icon" href="data:," />
    <title>whack</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Game view"></canvas>
      <div id="reticle" aria-hidden="true"></div>
      <div id="prompt" aria-live="polite"></div>
      <div id="timer" aria-live="polite"></div>
      <div id="hold" aria-live="polite"></div>
      <div id="subtitle" aria-live="polite"></div>
      <section id="inspect" hidden>
        <h2 id="inspect-title"></h2>
        <p id="inspect-text"></p>
        <small>E or click to close</small>
      </section>
      <div id="fade"></div>
      <div id="waiting">the building is preparing something</div>
      <section id="start">
        <h1>whack</h1>
        <p>No room exists until you reach it.</p>
        <button id="start-button" type="button">Click to begin</button>
        <small>WASD to move · mouse to look · E to interact · M for sound · Esc to pause</small>
        <small>Best with headphones.</small>
        <small id="status-llm" class="status">Model: checking…</small>
        <small id="status-voice" class="status"></small>
      </section>
      <section id="dossier" hidden></section>
      <pre id="debug" hidden></pre>
    </main>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
