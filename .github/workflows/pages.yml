# Builds the game and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site is then at https://<owner>.github.io/<repo name>/
#
# No keys are built in. Players can add their own on the start screen (rooms via
# OpenRouter or a local model, the narrator's voice via ElevenLabs); without
# them the game plays with template rooms and subtitles.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Served under /<repo name>/, so this follows the repo if it is renamed.
          PAGES_BASE: /${{ github.event.repository.name }}/
          # The narrator's voice for players who add an ElevenLabs key (they can change it on the start screen).
          ELEVENLABS_VOICE_ID: pqHfZKP75CvOlQylNhV4
          # Optional play-data collection: set these as repository variables to turn it on (Settings → Secrets and
          # variables → Actions → Variables). Left unset, the consent box is hidden and nothing is sent.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
